# Project-level GPSE configuration example.
# Copy to gpse.yaml for shared project defaults, or gpse.local.yaml for
# machine-specific paths.

external_tools:
  - name: plink
    cmd: plink

  - name: java
    cmd: java
    required: false

convert:
  # Optional Beagle jar used only when imputation is enabled.
  # Replace this placeholder with the path on your machine, or override in
  # `gpse.local.yaml` (gitignored) to keep local paths out of version control.
  beagle_jar_path: /path/to/beagle.jar
