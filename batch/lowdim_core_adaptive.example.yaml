# Example configuration for the adaptive GPSE batch scheduler.
#
# Copy/edit this file and pass it to the launcher:
#
#   CONFIG=batch/lowdim_core_adaptive.yaml \
#       bash batch/launch_lowdim_adaptive.sh
#
# or preview without launching:
#
#   CONFIG=batch/lowdim_core_adaptive.yaml \
#       bash batch/launch_lowdim_adaptive.sh --dry-run
#
# Do not commit absolute paths to the repository.

defaults:
  # Shared data sources
  geno_file: /path/to/lowdim_geno.csv
  pheno_file: /path/to/lowdim_pheno.csv

  # GPSE training protocol (DO NOT change the scientific constants here:
  # random_seed=42, n_repeats=50, n_splits=5, use_stacking=true, top_n_models=3)
  task_type: regression
  n_repeats: 50
  n_splits: 5
  random_seed: 42
  use_stacking: true
  top_n_models: 3
  standardize_phenotype: true

  # Per-trait parallel budget (scheduler may downgrade under memory pressure)
  threads: 8
  max_workers: 8
  n_jobs: 1
  repeat_workers: 1

  # Command used to launch each trait; override per trait if needed
  gpse_command: ["python", "-m", "gpse", "train"]

  # Optional list of expected models — used by the scheduler to verify
  # run_summary.json completeness before marking a trait DONE.
  expected_models:
    - rf_reg
    - xgboost_reg
    - lightgbm_reg
    - catboost_reg
    - gbdt_reg
    - elasticnet_reg
    - lasso_reg
    - gblup_reg
    - kernelridge_reg
    - mlp_reg
    - knn_reg
    - svr_reg

traits:
  - {species: tomato, name: FW}
  - {species: tomato, name: FT}
  - {species: tomato, name: DTF}
  - {species: tomato, name: Plant_Height}
  - {species: tomato, name: Leaf_Length}
  - {species: tomato, name: Leaf_Width}
  - {species: tomato, name: Fruit_Color}
  - {species: tomato, name: Soluble_Solids}
  - {species: tomato, name: Titratable_Acidity}
  - {species: tomato, name: Yield}
  - {species: tomato, name: Brix}
